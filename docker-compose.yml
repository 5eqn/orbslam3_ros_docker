version: '3'

services:
  orbslam3:
    image: orbslam3_ros:v9
    container_name: orbslam3
    hostname: orbslam3
    network_mode: "host"  # 使用主机网络
    environment:
      - ROS_HOSTNAME=orbslam3
      - ROS_MASTER_URI=http://orbslam3:11311
      - DISPLAY=:1
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash /orbslam3_init.sh
    tty: true
    stdin_open: true

  kalibr:
    image: stereolabs/kalibr:kinetic
    container_name: kalibr
    hostname: kalibr
    network_mode: "host"  # 使用主机网络
    depends_on:
      - orbslam3
    environment:
      - ROS_HOSTNAME=orbslam3
      - ROS_MASTER_URI=http://orbslam3:11311
      - DISPLAY=:2
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: tail -f /dev/null
    tty: true
    stdin_open: true
